# Grafana: dashboards + log search. Everything is provisioned from the repo, so there's
# no persistent volume: dashboards edited in the UI are lost on restart unless exported
# into apps/monitoring/dashboards/.
# The chart moved to grafana-community; the grafana/helm-charts copy is deprecated.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: grafana
  namespace: kube-system
spec:
  repo: https://grafana-community.github.io/helm-charts
  chart: grafana
  version: 14.4.1              # appVersion 13.3.1
  targetNamespace: monitoring
  valuesContent: |-
    # Secret created by deploy.sh from apps/monitoring/.env
    admin:
      existingSecret: grafana-admin
      userKey: GRAFANA_ADMIN_USER
      passwordKey: GRAFANA_ADMIN_PASSWORD

    # ServiceLB: http://<node-ip>:3000
    service:
      type: LoadBalancer
      port: 3000
      targetPort: 3000

    persistence:
      enabled: false
    testFramework:
      enabled: false

    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }

    grafana.ini:
      analytics:
        reporting_enabled: false
        check_for_updates: false

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus-server.monitoring.svc.cluster.local
            isDefault: true
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.monitoring.svc.cluster.local:3100

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: community
            folder: Community
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/community
          - name: homelab
            folder: Homelab
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/homelab

    # grafana.com dashboards, pinned by revision. An init container downloads them at
    # pod start, so Grafana needs internet access when it starts.
    dashboards:
      community:
        node-exporter-full:
          gnetId: 1860
          revision: 46
        nvidia-gpu:            # made for nvidia_gpu_exporter
          gnetId: 14574
          revision: 18
        k8s-views-global:
          gnetId: 15757
          revision: 43
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus }
        k8s-views-pods:
          gnetId: 15760
          revision: 41
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus }

    # Our own dashboards: ConfigMap generated by deploy.sh from apps/monitoring/dashboards/.
    # Mounted as a volume, so edits show up without a Grafana restart.
    dashboardsConfigMaps:
      homelab: grafana-dashboards
