# Grafana Alloy as a per-node log collector (Promtail is EOL since 2026-03-02).
# Each pod tails /var/log/pods on its own node and keeps its read positions on the
# host (/var/lib/alloy), so restarts and power-offs neither lose nor re-send logs.
# A DaemonSet already is the multi-node pattern: a new node gets its own Alloy pod.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: alloy
  namespace: kube-system
spec:
  repo: https://grafana.github.io/helm-charts
  chart: alloy
  version: 1.15.0              # appVersion v1.21.3
  targetNamespace: monitoring
  valuesContent: |-
    controller:
      type: daemonset
      tolerations:
        - operator: Exists     # every node's logs, including tainted GPU nodes
      volumes:
        extra:
          - name: alloy-data
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate

    # Only what this config uses (the chart default also reads every Secret cluster-wide).
    rbac:
      rules:
        - apiGroups: [""]
          resources: ["pods", "namespaces", "events"]
          verbs: ["get", "list", "watch"]
      clusterRules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]

    configReloader:
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { memory: 64Mi }

    alloy:
      enableReporting: false
      clustering:
        enabled: true          # only used by the events source below
      storagePath: /var/lib/alloy/data
      mounts:
        varlog: true           # read-only /var/log (pod logs live in /var/log/pods)
        extra:
          - name: alloy-data
            mountPath: /var/lib/alloy
      # Root is needed to read the node's log files; no capabilities beyond that.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 256Mi }
      # Note: this string goes through Helm's tpl, so it must not contain double curly braces.
      configMap:
        content: |-
          // ---- Container logs -------------------------------------------------
          // Pods on this node only (HOSTNAME is the node name, set by the chart).
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // app = pod label "app", else "app.kubernetes.io/name", else the container name.
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_name"]
              separator     = ";"
              regex         = ";*([^;]+).*"
              target_label  = "app"
            }
            // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          loki.process "pods" {
            // Parse the containerd (CRI) log format: timestamp, stream, flags, message.
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }

          // ---- Kubernetes events (k8s itself keeps them only ~1 h) -------------
          // Clustering splits namespaces across Alloy pods, so with several nodes
          // each event is still shipped once.
          loki.source.kubernetes_events "events" {
            job_name   = "kubernetes-events"
            log_format = "logfmt"
            forward_to = [loki.write.default.receiver]
            clustering {
              enabled = true
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
