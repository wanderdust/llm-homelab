# Prometheus + node-exporter + kube-state-metrics, installed by the k3s Helm controller.
# Changing valuesContent or version and re-applying triggers a helm upgrade.
# Deleting this object uninstalls the release (the PVC is kept).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: prometheus
  version: 29.47.2             # appVersion v3.16.0
  targetNamespace: monitoring
  valuesContent: |-
    alertmanager:
      enabled: false           # no alerting for now
    prometheus-pushgateway:
      enabled: false

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }

    prometheus-node-exporter:
      # Chart default already tolerates every NoSchedule taint, so it runs on all nodes.
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }

    configmapReload:
      prometheus:
        resources:
          requests: { cpu: 5m, memory: 16Mi }
          limits: { memory: 32Mi }

    server:
      global:
        scrape_interval: 30s
        evaluation_interval: 30s
      retention: 7d
      retentionSize: 8GB       # local-path doesn't enforce PVC size; this is the real disk guard
      persistentVolume:
        enabled: true
        storageClass: local-path
        size: 10Gi
      # Chart default is Recreate: a second server can't open the locked TSDB on the same PVC.
      strategy:
        type: Recreate
      service:
        type: ClusterIP        # no auth: reach it with kubectl port-forward, not the LAN
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { memory: 1Gi }
      # LLM API key, generated by deploy.sh from apps/llm/.env. Optional so Prometheus
      # still starts if the llm app isn't set up (the llm target then fails to scrape).
      extraSecretMounts:
        - name: llm-scrape
          mountPath: /etc/llm-scrape
          secretName: llm-scrape
          readOnly: true
          optional: true

    scrapeConfigs:
      # Defaults kept: prometheus, kubernetes-api-servers, kubernetes-nodes (kubelet),
      # kubernetes-nodes-cadvisor, kubernetes-service-endpoints (node-exporter,
      # kube-state-metrics, CoreDNS), kubernetes-pods (GPU exporter) and their -slow variants.
      prometheus-pushgateway:
        enabled: false
      kubernetes-services:
        enabled: false         # blackbox probes; no blackbox exporter here

      # llama-server /metrics. It needs the API key, and the llm Service has no labels,
      # so discover the pods directly: no change to the llm app needed.
      # While the LLM is off (replicas=0) this job simply has no targets.
      llm:
        scrape_interval: 15s
        metrics_path: /metrics
        authorization:
          type: Bearer
          credentials_file: /etc/llm-scrape/LLAMA_API_KEY
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [llm]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: llm
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
