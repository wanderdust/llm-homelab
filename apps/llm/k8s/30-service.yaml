# LoadBalancer on k3s = ServiceLB: exposes the port on the node's own IP,
# so the URL is http://<server-ip>:8080/v1 — same as the Docker setup.
apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: llm
spec:
  type: LoadBalancer
  selector:
    app: llm
  ports:
    - name: http
      port: 8080
      targetPort: http
